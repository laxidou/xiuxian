syntax = "proto3";

package xiuxian.v1;

import "google/api/annotations.proto";
import "google/protobuf/empty.proto";

option go_package = "xiuxian/gen/go/xiuxian/v1;xiuxianv1";

service WorldService {
  rpc GetGameRules(GetGameRulesRequest) returns (GameRules) {
    option (google.api.http) = { get: "/game-rules" };
  }
  rpc GetState(GetStateRequest) returns (RoleState) {
    option (google.api.http) = { get: "/state" };
  }
  rpc GetWorldBounds(GetWorldBoundsRequest) returns (WorldBounds) {
    option (google.api.http) = { get: "/world/bounds" };
  }
  rpc Scan(ScanRequest) returns (ScanResponse) {
    option (google.api.http) = { post: "/scans" body: "*" };
  }
  rpc Move(MoveRequest) returns (RoleState) {
    option (google.api.http) = { post: "/movements" body: "*" };
  }
  rpc MoveDirection(MoveDirectionRequest) returns (RoleState) {
    option (google.api.http) = { post: "/directional-movements" body: "*" };
  }
  rpc Stop(StopRequest) returns (RoleState) {
    option (google.api.http) = { post: "/movement-stops" body: "*" };
  }
  rpc TransferCultivation(TransferCultivationRequest) returns (RoleState) {
    option (google.api.http) = { post: "/cultivation-transfers" body: "*" };
  }
  rpc SeizeCultivation(SeizeCultivationRequest) returns (RoleState) {
    option (google.api.http) = { post: "/cultivation-seizures" body: "*" };
  }
  rpc Reincarnate(ReincarnateRequest) returns (RoleState) {
    option (google.api.http) = { post: "/reincarnations" body: "*" };
  }
  rpc ListRecentEvents(ListRecentEventsRequest) returns (ListRecentEventsResponse) {
    option (google.api.http) = { get: "/events" };
  }
  rpc ListConversations(ListConversationsRequest) returns (ListConversationsResponse) {
    option (google.api.http) = { get: "/conversations" };
  }
  rpc RequestConversation(RequestConversationRequest) returns (Conversation) {
    option (google.api.http) = { post: "/conversations" body: "*" };
  }
  rpc RespondConversation(RespondConversationRequest) returns (Conversation) {
    option (google.api.http) = { post: "/conversation-responses" body: "*" };
  }
  rpc SendConversationMessage(SendConversationMessageRequest) returns (ConversationMessage) {
    option (google.api.http) = { post: "/conversation-messages" body: "*" };
  }
  rpc CloseConversation(CloseConversationRequest) returns (Conversation) {
    option (google.api.http) = { post: "/conversation-closures" body: "*" };
  }
}

service AuthService {
  rpc Register(RegisterRequest) returns (AuthResponse) {
    option (google.api.http) = { post: "/registrations" body: "*" };
  }
  rpc Login(LoginRequest) returns (AuthResponse) {
    option (google.api.http) = { post: "/sessions" body: "*" };
  }
  rpc Logout(LogoutRequest) returns (google.protobuf.Empty) {
    option (google.api.http) = { delete: "/session" };
  }
  rpc RotateMCPKey(RotateMCPKeyRequest) returns (RotateMCPKeyResponse) {
    option (google.api.http) = { post: "/mcp-key-rotations" body: "*" };
  }
  rpc RevokeMCPKey(RevokeMCPKeyRequest) returns (google.protobuf.Empty) {
    option (google.api.http) = { delete: "/mcp-key" };
  }
}

message RegisterRequest {
  string account = 1;
  string password = 2;
  string role_name = 3;
}

message LoginRequest {
  string account = 1;
  string password = 2;
}

message LogoutRequest {}
message RotateMCPKeyRequest {}
message RevokeMCPKeyRequest {}
message AuthResponse { RoleState state = 1; }
message RotateMCPKeyResponse { string api_key = 1; }

message GetStateRequest {}
message GetGameRulesRequest {}
message GetWorldBoundsRequest {}
message ScanRequest {
  int64 expected_life_number = 1;
  int64 expected_state_version = 2;
}

message Position {
  sint64 x_milliunits = 1;
  sint64 y_milliunits = 2;
}

message RoleState {
  string id = 1;
  string name = 2;
  int64 life_number = 3;
  string status = 4;
  int64 cultivation_millis = 5;
  int32 realm_level = 6;
  string realm_name = 7;
  int64 age_millis = 8;
  int64 lifespan_millis = 9;
  int64 speed = 10;
  int64 sense_radius = 11;
  Position position = 12;
  string movement_state = 13;
  int64 state_version = 14;
  int32 rule_version = 15;
  string movement_mode = 16;
  string movement_direction = 17;
  int64 movement_speed_setting = 18;
  int64 actual_movement_speed = 19;
}

message GameRuleSection {
  string id = 1;
  string title = 2;
  string body = 3;
}

message RealmRule {
  int32 level = 1;
  string name = 2;
  int64 cultivation_threshold_millis = 3;
  int64 lifespan_millis = 4;
  int64 speed = 5;
  int64 sense_radius = 6;
}

message GameRules {
  int32 rule_version = 1;
  string title = 2;
  string summary = 3;
  repeated GameRuleSection sections = 4;
  repeated RealmRule realms = 5;
  string ai_rules = 6;
  string canonical_url = 7;
}

message WorldBounds {
  sint64 min_x_milliunits = 1;
  sint64 max_x_milliunits = 2;
  sint64 min_y_milliunits = 3;
  sint64 max_y_milliunits = 4;
}

message ScanRole {
  string id = 1;
  string name = 2;
  string realm = 3;
  string status = 4;
  double distance = 5;
  optional Position position = 6;
  bool can_transfer = 7;
  bool can_seize = 8;
  bool can_request_conversation = 9;
}

message OpportunitySignal {
  string message = 1;
  double distance = 2;
}

message ScanResponse {
  repeated ScanRole roles = 1;
  repeated OpportunitySignal opportunities = 2;
  bool has_more = 3;
  int32 truncated_roles = 4;
  int32 truncated_opportunities = 5;
}

message MoveRequest {
  string idempotency_key = 1;
  Position target = 2;
  int64 expected_life_number = 3;
  int64 expected_state_version = 4;
}

enum Direction {
  DIRECTION_UNSPECIFIED = 0;
  DIRECTION_UP = 1;
  DIRECTION_DOWN = 2;
  DIRECTION_LEFT = 3;
  DIRECTION_RIGHT = 4;
}

message MoveDirectionRequest {
  string idempotency_key = 1;
  Direction direction = 2;
  int64 speed = 3;
  int64 expected_life_number = 4;
  int64 expected_state_version = 5;
}

message StopRequest {
  string idempotency_key = 1;
  int64 expected_life_number = 2;
  int64 expected_state_version = 3;
}

message TransferCultivationRequest {
  string idempotency_key = 1;
  string target_id = 2;
  int64 amount_minutes = 3;
  int64 expected_life_number = 4;
  int64 expected_state_version = 5;
}

message SeizeCultivationRequest {
  string idempotency_key = 1;
  string target_id = 2;
  int64 expected_life_number = 3;
  int64 expected_state_version = 4;
}

message ReincarnateRequest {
  string idempotency_key = 1;
  optional Position position = 2;
  bool random = 3;
  int64 expected_life_number = 4;
  int64 expected_state_version = 5;
}

message ListRecentEventsRequest {
  int64 after = 1;
  int32 limit = 2;
}

message WorldEvent {
  int64 id = 1;
  string type = 2;
  string message = 3;
  int64 created_at_unix_millis = 4;
  int64 life_number = 5;
  string data_json = 6;
}

message ListRecentEventsResponse { repeated WorldEvent events = 1; }

message ListConversationsRequest {}

message ConversationMessage {
  int64 id = 1;
  string sender_id = 2;
  string content = 3;
  bool trusted = 4;
  int64 created_at_unix_millis = 5;
}

message Conversation {
  string id = 1;
  string requester_id = 2;
  string recipient_id = 3;
  string status = 4;
  repeated ConversationMessage messages = 5;
  int64 created_at_unix_millis = 6;
  int64 updated_at_unix_millis = 7;
}

message ListConversationsResponse { repeated Conversation conversations = 1; }

message RequestConversationRequest {
  string idempotency_key = 1;
  string target_id = 2;
  int64 expected_life_number = 3;
  int64 expected_state_version = 4;
}

message RespondConversationRequest {
  string idempotency_key = 1;
  string conversation_id = 2;
  string action = 3;
  int64 expected_life_number = 4;
  int64 expected_state_version = 5;
}

message SendConversationMessageRequest {
  string idempotency_key = 1;
  string conversation_id = 2;
  string content = 3;
  int64 expected_life_number = 4;
  int64 expected_state_version = 5;
}

message CloseConversationRequest {
  string idempotency_key = 1;
  string conversation_id = 2;
  int64 expected_life_number = 3;
  int64 expected_state_version = 4;
}
