name: xiuxian

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: xiuxian
      POSTGRES_USER: xiuxian
      POSTGRES_PASSWORD: xiuxian_dev
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U xiuxian -d xiuxian"]
      interval: 3s
      timeout: 3s
      retries: 20

  redis:
    image: redis:8-alpine
    command: ["redis-server", "--appendonly", "no", "--save", ""]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 3s
      timeout: 3s
      retries: 20

  migrate:
    build:
      context: .
      args: { BINARY: migrate }
    environment:
      DATABASE_URL: postgres://xiuxian:xiuxian_dev@postgres:5432/xiuxian?sslmode=disable
    depends_on:
      postgres: { condition: service_healthy }
    restart: "no"

  game-server:
    build:
      context: .
      args: { BINARY: game-server }
    environment:
      DATABASE_URL: postgres://xiuxian:xiuxian_dev@postgres:5432/xiuxian?sslmode=disable
      REDIS_URL: redis://redis:6379/0
      GAME_SERVER_ADDRESS: :8080
      GAME_SERVER_GRPC_ADDRESS: :9090
      COOKIE_SECURE: "false"
      WORKER_TOKEN: xiuxian-local-worker-token
      APP_VERSION: local-compose
      ALLOW_TEST_CLOCK: ${ALLOW_TEST_CLOCK:-false}
      TEST_CLOCK_START_UNIX_MILLIS: ${TEST_CLOCK_START_UNIX_MILLIS:-0}
    depends_on:
      migrate: { condition: service_completed_successfully }
      redis: { condition: service_healthy }
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8080/healthz"]
      interval: 3s
      timeout: 3s
      retries: 20

  worker:
    build:
      context: .
      args: { BINARY: worker }
    environment:
      DATABASE_URL: postgres://xiuxian:xiuxian_dev@postgres:5432/xiuxian?sslmode=disable
      REDIS_URL: redis://redis:6379/0
      GAME_SERVER_URL: http://game-server:8080
      WORKER_TOKEN: xiuxian-local-worker-token
    depends_on:
      migrate: { condition: service_completed_successfully }
      redis: { condition: service_healthy }

  mcp-gateway:
    build:
      context: .
      args: { BINARY: mcp-gateway }
    environment:
      GAME_SERVER_GRPC_ADDRESS: game-server:9090
      MCP_GATEWAY_ADDRESS: :8090
      REDIS_URL: redis://redis:6379/0
    depends_on:
      game-server: { condition: service_healthy }
      redis: { condition: service_healthy }
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8090/healthz"]
      interval: 3s
      timeout: 3s
      retries: 20

  web:
    build: ./web
    depends_on:
      game-server: { condition: service_healthy }

  caddy:
    image: caddy:2.10-alpine
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      web: { condition: service_started }
      mcp-gateway: { condition: service_healthy }

volumes:
  postgres-data:
  caddy-data:
  caddy-config:
